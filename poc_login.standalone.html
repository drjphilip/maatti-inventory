<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POC Access — Maatti</title>
<style>
:root {
  --bg: #FAF6F0;
  --surface: #FFFFFF;
  --surface-soft: #F3EDE3;
  --ink: #3E2E22;
  --ink-soft: #7A6A5B;
  --line: #E4DACA;
  --accent: #B0763B;
  --accent-soft: #F0E3D2;
  --green: #3E7C4F;
  --green-soft: #E4F0E6;
  --amber: #B8860B;
  --amber-soft: #FAF0DC;
  --red: #B23B2E;
  --red-soft: #F9E3E0;
  --radius: 14px;
  --shadow: 0 2px 8px rgba(62, 46, 34, 0.06);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  padding: 0;
}
.page { max-width: 820px; margin: 0 auto; padding: 36px 18px 60px; }
header { text-align: center; margin-bottom: 28px; }
.logo { width: 200px; height: auto; display: block; margin: 0 auto 14px; }
.eyebrow {
  font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); font-weight: 600; margin-bottom: 6px;
}
h1 {
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(26px, 4vw, 34px); font-weight: 600; margin: 0;
  letter-spacing: -0.01em;
}
/* Mobile-friendly login page */
.page.login {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; text-align: center;
}
.page.login header { margin-bottom: 30px; }
.page.login .field { max-width: 200px; margin: 0 auto 18px; text-align: center; }
.page.login #poccode {
  width: 100%; max-width: 150px; margin: 0 auto;
  font-size: 26px; letter-spacing: 0.5em; text-align: center;
  padding: 16px 10px; border-radius: 12px;
}
.page.login .submit-btn { max-width: 200px; }
.field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; text-align: left; }
.field input, .field textarea {
  width: 100%; padding: 11px 13px; border: 1px solid var(--line);
  border-radius: 10px; font-size: 15px; font-family: inherit; background: var(--surface);
  color: var(--ink);
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.submit-btn {
  display: block; width: 100%; max-width: 320px; margin: 8px auto 0;
  padding: 13px; font-size: 16px; font-weight: 600; font-family: inherit;
  color: #fff; background: var(--accent); border: 0; border-radius: 12px; cursor: pointer;
}
.submit-btn:hover { background: #8c5f2e; }
.status { font-size: 13.5px; margin: 14px auto 0; max-width: 320px; color: var(--red); min-height: 18px; }
</style>
</head>
<body>
<div class="page login">
  <header>
    <a class="logo" href="index.html"><img src="docs/maatti-logo.png" alt="Maatti" /></a>
    <div class="eyebrow">Point of Contact</div>
    <h1>Order Dashboard</h1>
  </header>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <input id="poccode" name="poccode" type="text" inputmode="text"
             autocomplete="off" autocapitalize="characters" spellcheck="false"
             placeholder="• • •" maxlength="3" aria-label="POC code">
    </div>
    <button type="submit" class="submit-btn">Open Dashboard</button>
    <p class="status" id="status" hidden></p>
  </form>
</div>
<script>
(function () {
  'use strict';

  // Only these POC codes may log in.
  const ALLOWED = ['J', 'JJ', 'BT', 'PT', 'IA', 'JP'];

  const form = document.getElementById('loginForm');
  const input = document.getElementById('poccode');
  const status = document.getElementById('status');

  input.addEventListener('input', function () {
    input.value = input.value.replace(/[^A-Za-z]/g, '').toUpperCase();
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const v = (input.value || '').trim().toUpperCase();
    if (ALLOWED.indexOf(v) === -1) {
      status.hidden = false;
      status.textContent = 'That code is not recognised. Please try again.';
      return;
    }
    status.hidden = true;
    window.location.href = 'poc.standalone.html?initials=' + encodeURIComponent(v);
  });
})();
</script>
</body>
</html>
