<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maatti Inventory</title>
<style>
  :root {
    --bg: #FAF6F0;
    --surface: #FFFFFF;
    --surface-soft: #F3EDE3;
    --ink: #3E2E22;
    --ink-soft: #7A6A5B;
    --line: #E4DACA;
    --accent: #B0763B;
    --accent-soft: #F0E3D2;
    --green: #3E7C4F;
    --green-soft: #E4F0E6;
    --amber: #B8860B;
    --amber-soft: #FAF0DC;
    --red: #B23B2E;
    --red-soft: #F9E3E0;
    --radius: 14px;
    --shadow: 0 2px 8px rgba(62, 46, 34, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 0;
  }
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 34px;
  }
  .logo {
    width: 250px;
    height: auto;
    display: block;
    margin: 0 auto 18px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 6px;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .toolbar {
    display: none;
  }
  .updated {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
  }
  .dot.pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th {
    text-align: center;
    padding: 7px 10px;
    background: var(--surface-soft);
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    font-weight: 600;
  }
  tbody td {
    text-align: center;
    padding: 6px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  .order-cell { text-align: center; }
  .order-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .order-btn:hover:not(.disabled) { background: var(--accent); color: #fff; }
  .order-btn:active:not(.disabled) { transform: scale(0.96); }
  .order-btn.disabled { opacity: 0.45; cursor: not-allowed; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.out-of-stock-row {
    opacity: 0.45;
  }
  tbody tr.out-of-stock-row:hover {
    background: var(--surface);
  }
  tbody tr:hover { background: #FBF7F0; }
  .product-name {
    font-weight: 600;
    font-size: 15px;
    text-align: left;
  }
  .product-name .weight {
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-soft);
    margin-left: 4px;
  }
  .price {
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-soft);
    font-size: 14.5px;
  }
  footer {
    margin-top: 26px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12.5px;
    line-height: 1.6;
  }
  .poc-link { margin-top: 14px; }
  .poc-btn {
    display: inline-block; padding: 9px 18px; font-size: 13px; font-weight: 600;
    font-family: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--accent); border-radius: 10px; text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .poc-btn:hover { background: var(--accent); color: #fff; }
  @media (max-width: 760px) {
    thead th, tbody td { padding: 5px 7px; }
  }
  @media (max-width: 420px) {
    .page { padding: 28px 14px 48px; }
    .logo { width: 180px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <img class="logo" src="docs/maatti-logo.png" alt="Maatti" />
    <div class="eyebrow">Bangalore · Live Inventory</div>
    <h1>What&apos;s on the shelf</h1>
  </header>

  
  <div class="updated">
    <span class="dot" id="statusDot"></span>
    <span id="updatedText">Connecting to inventory…</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Order</th>
        </tr>
      </thead>
      <tbody id="inventoryBody"></tbody>
    </table>
    <div class="empty" id="emptyState" hidden>No products found.</div>
  </div>

  <footer>
    Stock data syncs automatically from our Google Sheet.
    <div class="poc-link">
      <a class="poc-btn" href="poc_login.html">POC Dashboard</a>
    </div>
  </footer>
</div>

<script src="inventory.js"></script>
<script>
  const body = document.getElementById('inventoryBody');
  const emptyState = document.getElementById('emptyState');
  const updatedText = document.getElementById('updatedText');
  const statusDot = document.getElementById('statusDot');

  function getStatus(stock) {
    if (stock === 0) return { label: 'Out of Stock', className: 'out-of-stock' };
    if (stock <= 5) return { label: 'Low Stock', className: 'low-stock' };
    return { label: 'In Stock', className: 'in-stock' };
  }

  function render(items) {
    let visible = items.slice();

    body.innerHTML = '';
    emptyState.hidden = visible.length > 0;

    visible.sort((a, b) => {
      if (a.stock > 0 && b.stock === 0) return -1;
      if (a.stock === 0 && b.stock > 0) return 1;
      return 0;
    });

    visible.forEach(item => {
      const status = getStatus(item.stock);
      const row = document.createElement('tr');
      if (item.stock === 0) row.className = 'out-of-stock-row';

      const nameCell = document.createElement('td');
      nameCell.className = 'product-name';
      const nameText = document.createElement('span');
      nameText.textContent = item.name;
      nameCell.appendChild(nameText);
      if (item.weight) {
        const weightText = document.createElement('span');
        weightText.className = 'weight';
        weightText.textContent = '· ' + item.weight;
        nameCell.appendChild(weightText);
      }

      const priceCell = document.createElement('td');
      priceCell.className = 'price';
      priceCell.textContent = maattiInventory.formatPrice(item.price);

      const orderCell = document.createElement('td');
      orderCell.className = 'order-cell';
      const orderBtn = document.createElement('button');
      orderBtn.className = 'order-btn' + (item.stock === 0 ? ' disabled' : '');
      orderBtn.textContent = item.stock === 0 ? 'Sold Out' : 'Order';
      orderBtn.addEventListener('click', function () {
        if (item.stock > 0) {
          window.location.href = 'order.html?product=' + encodeURIComponent(item.name);
        }
      });
      orderCell.appendChild(orderBtn);

      row.appendChild(nameCell);
      row.appendChild(priceCell);
      row.appendChild(orderCell);
      body.appendChild(row);
    });
  }

  window.onInventoryReady = function (items, when) {
    updatedText.textContent = 'Last updated ' +
      when.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    statusDot.classList.add('pulse');
    render(items);
  };

  window.onInventoryError = function () {
    updatedText.textContent = 'Unable to read inventory data. Please refresh.';
    statusDot.style.background = 'var(--red)';
  };

  maattiInventory.start();
</script>
</body>
</html>
