<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maatti Inventory</title>
<style>
  :root {
    --bg: #FAF6F0;
    --surface: #FFFFFF;
    --surface-soft: #F3EDE3;
    --ink: #3E2E22;
    --ink-soft: #7A6A5B;
    --line: #E4DACA;
    --accent: #B0763B;
    --accent-soft: #F0E3D2;
    --green: #3E7C4F;
    --green-soft: #E4F0E6;
    --amber: #B8860B;
    --amber-soft: #FAF0DC;
    --red: #B23B2E;
    --red-soft: #F9E3E0;
    --radius: 14px;
    --shadow: 0 2px 8px rgba(62, 46, 34, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 0;
  }
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 34px;
  }
  .logo {
    width: 216px;
    height: auto;
    display: block;
    margin: 0 auto 14px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 6px;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .search {
    flex: 1;
    min-width: 220px;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--ink-soft);
  }
  .refresh {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .refresh:hover { background: #9A642F; }
  .refresh:active { transform: scale(0.98); }
  .refresh svg { width: 16px; height: 16px; }
  .refresh.loading svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .updated {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
  }
  .dot.pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14.5px;
  }
  thead th {
    text-align: left;
    padding: 14px 18px;
    background: var(--surface-soft);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    font-weight: 600;
  }
  tbody td {
    padding: 13px 18px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.out-of-stock-row {
    opacity: 0.45;
  }
  tbody tr.out-of-stock-row:hover {
    background: var(--surface);
  }
  tbody tr:hover { background: #FBF7F0; }
  .product-name {
    font-weight: 600;
    font-size: 15px;
  }
  .price {
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .weight {
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .stock-num {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .badge.in-stock { background: var(--green-soft); color: var(--green); }
  .badge.low-stock { background: var(--amber-soft); color: var(--amber); }
  .badge.out-of-stock { background: var(--red-soft); color: var(--red); }
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-soft);
    font-size: 14.5px;
  }
  footer {
    margin-top: 26px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12.5px;
    line-height: 1.6;
  }
  @media (max-width: 760px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .refresh { justify-content: center; }
    .table-wrap { overflow-x: auto; }
    table { min-width: 700px; }
  }
  @media (max-width: 420px) {
    .page { padding: 28px 14px 48px; }
    .logo { width: 180px; }
  }
</style>
</head>

    <div class="eyebrow">Bangalore · Live Inventory</div>
    <h1>What&apos;s on the shelf</h1>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      <input type="text" id="searchInput" placeholder="Search products…" />
    </div>
    <button class="refresh" id="refreshBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
      Refresh
    </button>
  </div>

  <div class="updated">
    <span class="dot" id="statusDot"></span>
    <span id="updatedText">Connecting to inventory…</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Weight</th>
          <th>Stock</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="inventoryBody"></tbody>
    </table>
    <div class="empty" id="emptyState" hidden>No products match your search.</div>
  </div>

  <footer>
    Stock data syncs automatically from our Google Sheet.
  </footer>
</div>

<script>
  const SHEET_ID = '1jAnvqv6uq0UTiRmFw2shcEcWNLOGEeN6kFFMSj13J1k';
  const INVENTORY_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Inventory`;
  const PRODUCTS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Products`;

  let inventory = [];
  let lastUpdated = null;
  let refreshTimer = null;
  let productsData = null;
  let inventoryData = null;
  let productsLoaded = false;

  const body = document.getElementById('inventoryBody');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const refreshBtn = document.getElementById('refreshBtn');
  const updatedText = document.getElementById('updatedText');
  const statusDot = document.getElementById('statusDot');

  function parseNumber(value) {
    if (value === null || value === undefined || value === '') return 0;
    return Number(String(value).replace(/,/g, '')) || 0;
  }

  function formatPrice(value) {
    return '₹' + Number(value).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function getStatus(stock) {
    if (stock === 0) return { label: 'Out of Stock', className: 'out-of-stock' };
    if (stock <= 5) return { label: 'Low Stock', className: 'low-stock' };
    return { label: 'In Stock', className: 'in-stock' };
  }

  function render() {
    const query = searchInput.value.trim().toLowerCase();
    let visible = inventory.slice();

    if (query) {
      visible = visible.filter(item => item.name.toLowerCase().includes(query));
    }

    body.innerHTML = '';
    emptyState.hidden = visible.length > 0;

    visible.sort((a, b) => {
      if (a.stock > 0 && b.stock === 0) return -1;
      if (a.stock === 0 && b.stock > 0) return 1;
      return 0;
    });

    visible.forEach(item => {
      const status = getStatus(item.stock);
      const row = document.createElement('tr');
      if (item.stock === 0) row.className = 'out-of-stock-row';

      const nameCell = document.createElement('td');
      nameCell.className = 'product-name';
      nameCell.textContent = item.name;

      const priceCell = document.createElement('td');
      priceCell.className = 'price';
      priceCell.textContent = formatPrice(item.price);

      const weightCell = document.createElement('td');
      weightCell.className = 'weight';
      weightCell.textContent = item.weight || '–';

      const stockCell = document.createElement('td');
      stockCell.className = 'stock-num';
      stockCell.textContent = item.stock;

      const statusCell = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'badge ' + status.className;
      badge.textContent = status.label;
      statusCell.appendChild(badge);

      row.appendChild(nameCell);
      row.appendChild(priceCell);
      row.appendChild(weightCell);
      row.appendChild(stockCell);
      row.appendChild(statusCell);
      body.appendChild(row);
    });

  }


  function handleBoth() {
    try {
      const invTable = inventoryData.table;
      const invCols = invTable.cols;
      const invRows = invTable.rows;
      const productsTable = productsData.table;
      const productsRows = productsTable.rows;
      const productsCols = productsTable.cols;

      // Build weight lookup from Products sheet (col 0 = name, col 4 = weight)
      const weightMap = {};
      for (let i = 0; i < productsRows.length; i++) {
        const cells = productsRows[i].c;
        const name = cells[0] && cells[0].v ? String(cells[0].v).trim() : '';
        const weight = cells[4] && cells[4].v != null ? String(cells[4].v) : '';
        if (name) weightMap[name] = weight;
      }

      const priceRow = invRows[0] ? invRows[0].c : [];
      const stockRow = invRows[4] ? invRows[4].c : [];

      inventory = [];
      for (let i = 3; i < invCols.length; i++) {
        const label = invCols[i] && invCols[i].label ? String(invCols[i].label) : '';
        const name = label.replace(/^Product\s*/, '').trim();
        if (!name) continue;

        const price = priceRow[i] ? parseNumber(priceRow[i].v) : 0;
        const stock = stockRow[i] ? parseNumber(stockRow[i].v) : 0;
        const weight = weightMap[name] || '';
        inventory.push({ name, price, weight, stock });
      }

      lastUpdated = new Date();
      updatedText.textContent = 'Last updated ' + lastUpdated.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      statusDot.classList.add('pulse');
      render();
    } catch (err) {
      updatedText.textContent = 'Unable to read inventory data. Please refresh.';
      statusDot.style.background = 'var(--red)';
    }
  }

  function loadProducts() {
    const oldScript = document.getElementById('productsLoader');
    if (oldScript) oldScript.remove();
    const script = document.createElement('script');
    script.id = 'productsLoader';
    script.src = PRODUCTS_URL + '&t=' + Date.now();
    document.body.appendChild(script);
  }

  function loadInventory() {
    const oldScript = document.getElementById('inventoryLoader');
    if (oldScript) oldScript.remove();
    const script = document.createElement('script');
    script.id = 'inventoryLoader';
    script.src = INVENTORY_URL + '&t=' + Date.now();
    document.body.appendChild(script);
  }

  function loadBoth() {
    refreshBtn.classList.add('loading');
    updatedText.textContent = 'Updating inventory…';
    productsData = null;
    inventoryData = null;
    productsLoaded = false;
    const oldProducts = document.getElementById('productsLoader');
    const oldInventory = document.getElementById('inventoryLoader');
    if (oldProducts) oldProducts.remove();
    if (oldInventory) oldInventory.remove();
    loadProducts();
  }

  refreshBtn.addEventListener('click', loadBoth);
  searchInput.addEventListener('input', render);

  loadBoth();
  refreshTimer = setInterval(loadBoth, 60000);
</script>
<script>
  window.google = window.google || {};
  window.google.visualization = window.google.visualization || {};
  window.google.visualization.Query = window.google.visualization.Query || {};
  window.google.visualization.Query.setResponse = function(response) {
    if (!productsLoaded) {
      productsData = response;
      productsLoaded = true;
      loadInventory();
    } else {
      inventoryData = response;
      handleBoth();
      const btn = document.getElementById('refreshBtn');
      if (btn) btn.classList.remove('loading');
    }
  };
</script>
</body>
</html>
